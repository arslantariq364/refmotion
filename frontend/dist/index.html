    <title>RefMotion Studio — Reference-Driven AI Video & Motion Platform</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("refmotion_theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
